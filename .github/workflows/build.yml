name: ニュースをビルドして公開

# 実行タイミング
on:
  schedule:
    # GitHubのcronはUTC。21:00 UTC = 翌06:00 JST（毎朝6時ごろ・数分前後あり）
    - cron: "0 21 * * *"
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [ main ]      # main への変更時にも更新

# GitHub Pages へデプロイするための権限
permissions:
  contents: write
  pages: write
  id-token: write

# 公開は1つずつ（同時実行を防ぐ）
# デプロイ途中で打ち切られないよう、進行中の実行はキャンセルしない
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      # 設定ファイルの書式ミス（カンマ抜け等）をここで検出して止める。
      # 失敗すると以降は実行されないため、公開中のページは無事なまま保たれる。
      - name: 設定ファイルの書式を確認
        run: |
          python -c "import json;json.load(open('feeds.json',encoding='utf-8'));print('feeds.json OK')"
          python -c "import json;json.load(open('paywall.json',encoding='utf-8'));print('paywall.json OK')"

      - name: ニュースデータ(data.js)を生成
        # 秘密のURLは Secrets から環境変数として渡す
        env:
          ALERT_SAWAKI_URL: ${{ secrets.ALERT_SAWAKI_URL }}
          ALERT_AQUA_URL: ${{ secrets.ALERT_AQUA_URL }}
          ALERT_CLAUDE_URL: ${{ secrets.ALERT_CLAUDE_URL }}
        run: python build_news.py

      # 見つけた記事の蓄積(archive.json)を保存する。
      # これが無いと、未読の記事が次回の取得で消えてしまう。
      # [skip ci] を付けるのは、このpushで再びビルドが走る無限ループを防ぐため。
      - name: 記事の蓄積を保存
        run: |
          if [ -n "$(git status --porcelain archive.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive.json
            git commit -m "記事の蓄積を更新 [skip ci]"
            git push
          else
            echo "蓄積に変化なし"
          fi

      - name: 公開用フォルダに配信ファイルを配置
        run: |
          mkdir -p _site
          cp index.html app.js data.js _site/

      - name: Pages 用にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4
