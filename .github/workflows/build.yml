name: ニュースをビルドして公開

# 実行タイミング
on:
  schedule:
    # GitHubのcronはUTC。ただし予約実行の時刻は保証されず、混雑時は待たされる。
    # 実測では90〜126分遅れて動いていた（毎時0分は最も混むので避ける）。
    # そこで届けたい時刻より約1時間半早く予約し、控えをもう1本ずつ置く。
    # 実測（2026-09-10〜21）：朝の枠は約2時間、昼前の枠は約4時間40分遅れて動く。
    # 遅れは時間帯でほぼ一定なので、それを見込んで予約する。
    - cron: "30 19 * * *"   # 04:30 JST 予定 → 実測 06:31〜07:36（朝）
    - cron: "10 21 * * *"   # 06:10 JST 予定 → 実測 07:59〜08:51（朝の控え）
    - cron: "50 22 * * *"   # 07:50 JST 予定 → 昼前に届く見込み（昼）
    - cron: "20 0 * * *"    # 09:20 JST 予定 → 昼ごろに届く見込み（昼の控え）
    - cron: "10 3 * * *"    # 12:10 JST 予定 → 実測 16:51〜17:49（夕方。夜のテレビ情報用）
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [ main ]      # main への変更時にも更新

# GitHub Pages へデプロイするための権限
permissions:
  contents: write
  pages: write
  id-token: write

# 公開は1つずつ（同時実行を防ぐ）
# デプロイ途中で打ち切られないよう、進行中の実行はキャンセルしない
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      # 設定ファイルの書式ミス（カンマ抜け等）をここで検出して止める。
      # 失敗すると以降は実行されないため、公開中のページは無事なまま保たれる。
      - name: 設定ファイルの書式を確認
        run: |
          python -c "import json;json.load(open('feeds.json',encoding='utf-8'));print('feeds.json OK')"
          python -c "import json;json.load(open('paywall.json',encoding='utf-8'));print('paywall.json OK')"

      - name: ニュースデータ(data.js)を生成
        # 秘密のURLは Secrets から環境変数として渡す
        env:
          ALERT_SAWAKI_URL: ${{ secrets.ALERT_SAWAKI_URL }}
          ALERT_AQUA_URL: ${{ secrets.ALERT_AQUA_URL }}
          ALERT_CLAUDE_URL: ${{ secrets.ALERT_CLAUDE_URL }}
        run: python build_news.py

      # 見つけた記事の蓄積(archive.json)を保存する。
      # これが無いと、未読の記事が次回の取得で消えてしまう。
      # コミットメッセージに合図を入れて、このpushで再びビルドが走る無限ループを防ぐ。
      # ※注意：この合図の文字列は、人が書くコミットメッセージ本文に含めてはいけない。
      #   説明のつもりで書くとビルド自体が起動しなくなる（実際に一度やらかした）。
      - name: 記事の蓄積を保存
        run: |
          if [ -n "$(git status --porcelain archive.json seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive.json seen.json
            git commit -m "記事の蓄積を更新 [skip ci]"
            # 別の実行が先に保存していると弾かれる。そのときは相手の蓄積を取り込み、
            # 自分の分を足して保存し直す（どちらかで上書きすると記事が消えるため）。
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "保存が弾かれたので合わせ直します（${i}回目）"
              cp archive.json /tmp/mine.json
              cp seen.json /tmp/mine_seen.json
              git fetch origin main
              git checkout -B main origin/main
              python merge_archive.py /tmp/mine.json archive.json
              if [ -f seen.json ]; then python merge_archive.py /tmp/mine_seen.json seen.json; else cp /tmp/mine_seen.json seen.json; fi
              git add archive.json seen.json
              git commit -m "記事の蓄積を更新 [skip ci]" || exit 0
            done
            echo "保存できませんでした（次回の更新で取り直します）"
            exit 1
          else
            echo "蓄積に変化なし"
          fi

      - name: 公開用フォルダに配信ファイルを配置
        run: |
          mkdir -p _site
          cp index.html app.js data.js _site/

      - name: Pages 用にアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4
