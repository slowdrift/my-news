<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイニュース</title>
<style>
  :root {
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --cat:#2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px 40px; }

  header { padding: 16px 4px 4px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  header .meta-head { color: var(--sub); font-size: 12px; margin-top: 3px; }
  header .age { margin-left: 4px; }
  header .age.stale { color: #b45309; font-weight: 600; }
  header .unread { margin-left: 8px; font-weight: 700; color: var(--accent); }
  .tools { margin: 8px 0 2px; }
  .tool-btn {
    font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--sub); font-weight: 600;
  }
  .tool-btn.on { border-color: var(--accent); color: var(--accent); background: #eff4ff; }

  /* 上部のカテゴリジャンプ */
  .catnav {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px;
    -webkit-overflow-scrolling: touch;
  }
  .catnav .nav-chip {
    flex: 0 0 auto; font-size: 11.5px; font-weight: 700; text-decoration: none;
    color: var(--cat); background: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .catnav .nav-chip span {
    margin-left: 5px; color: var(--sub); font-weight: 600;
  }

  /* カテゴリ（大見出し・折りたたみ） */
  details.cat { margin: 16px 0 4px; scroll-margin-top: 8px; }
  details.cat > summary {
    cursor: pointer; list-style: none; padding: 4px 2px 6px;
    border-bottom: 2px solid var(--cat);
  }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary h2 {
    margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em;
    color: var(--cat); display: flex; align-items: center; gap: 6px;
  }
  details.cat > summary h2::before { content: "▾"; font-size: 11px; }
  details.cat:not([open]) > summary h2::before { content: "▸"; }
  details.cat > summary .catcount {
    margin-left: auto; font-weight: 700; color: var(--cat);
    font-size: 11px; letter-spacing: 0;
  }
  details.cat > .body { padding-top: 4px; }

  /* テーマ（中見出し） */
  .group { margin: 12px 0 8px; }
  h3.ghead {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px;
    font-size: 15px; font-weight: 700;
  }
  .ghead .gname { border-left: 3px solid var(--cat); padding-left: 8px; }
  .ghead .gcount { font-size: 11px; color: var(--sub); font-weight: 400; }

  /* 記事カード */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px;
  }
  .card a.title {
    color: var(--ink); text-decoration: none; font-size: 13.5px; font-weight: 600;
    display: block; letter-spacing: .01em; line-height: 1.4;
  }
  .card a.title:active { color: var(--accent); }
  .card .summary { color: #4b5563; font-size: 12px; margin-top: 5px; line-height: 1.5; }

  /* リード（各テーマ先頭の大きめカード） */
  .card.lead { border-left: 3px solid var(--cat); padding: 11px 13px; }
  .card.lead a.title { font-size: 15.5px; line-height: 1.42; }

  /* メタ行：有料バッジ＋発信元チップ＋相対時刻 */
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .chip {
    font-size: 10px; color: #374151; background: #eef0f3;
    border-radius: 5px; padding: 1px 6px; font-weight: 600; white-space: nowrap;
  }
  .pw { font-size: 10px; border-radius: 5px; padding: 1px 6px; font-weight: 700; white-space: nowrap; }
  .pw.paid { color: #9a3412; background: #ffedd5; border: 1px solid #fed7aa; }
  .pw.partial { color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb; font-weight: 600; }
  .card .time { font-size: 10.5px; color: var(--sub); }
  .card:has(.pw.paid) a.title { color: #4b5563; }

  /* 既読（「既読も表示」時のみ現れる。読んだものと分かるよう薄く） */
  .card.read { opacity: .5; }
  .card.read a.title { color: var(--sub); font-weight: 500; }

  .empty { color: var(--sub); font-size: 12.5px; padding: 6px 2px; }

  /* 動画カード：左サムネ・右タイトルの横並びにして高さを抑える */
  .card.video { padding: 0; overflow: hidden; }
  .card.video a.vlink {
    display: flex; gap: 10px; align-items: flex-start;
    text-decoration: none; color: var(--ink); padding: 8px 10px;
  }
  .card.video a.vlink:active .title { color: var(--accent); }
  .card.video .thumb { position: relative; flex: 0 0 108px; display: block; }
  .card.video .thumb img {
    width: 108px; height: 61px; display: block; object-fit: cover; border-radius: 6px;
  }
  .card.video .thumb .play {
    position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); color:#fff; font-size: 9px; border-radius: 999px;
  }
  .card.video .vtext { min-width: 0; }
  .card.video .title {
    display: block; font-size: 12.5px; font-weight: 600; line-height: 1.38;
  }
  .card.video .meta { margin-top: 4px; }

  /* skim：初期は隠しておく余剰カード。もっと見るで展開 */
  .gitems:not(.expanded) > .card.extra { display: none; }
  .more-btn {
    display: block; width: 100%; margin: 2px 0 4px; padding: 6px;
    background: transparent; border: 1px dashed var(--line); border-radius: 9px;
    color: var(--cat); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .more-btn:active { background: #eef0f3; }

  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  footer details.diag > summary { cursor: pointer; font-size: 12px; color: var(--sub); }
  footer table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  footer td { padding: 4px 6px; border-bottom: 1px dashed var(--line); color: var(--sub); }
  footer td.st-ok { color:#15803d; }
  footer td.st-ng { color:#b45309; }
  .loaderr { padding: 24px 14px; color:#b91c1c; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><h1>📰 マイニュース</h1><div class="meta-head">読み込み中…</div></header>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
