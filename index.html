<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>マイニュース</title>
<style>
  /* 明るい配色（既定） */
  :root {
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --cat:#2563eb;
    --chip-bg:#eef0f3; --chip-ink:#374151; --btn-bg:#fff;
    --read-opacity:.5;
    --fs:1;           /* 文字サイズの倍率 */
  }
  /* 端末が暗い設定のとき（手動指定が無い＝自動のとき）だけ暗くする */
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg:#111318; --card:#1b1f27; --ink:#e8eaed; --sub:#9aa3af;
      --line:#2b313c; --accent:#7aa7ff; --chip-bg:#262c37; --chip-ink:#c3cad6;
      --btn-bg:#1b1f27;
      --read-opacity:.8;
    }
  }
  /* 手動で「暗い」を選んだとき */
  :root[data-theme="dark"] {
    --bg:#111318; --card:#1b1f27; --ink:#e8eaed; --sub:#9aa3af;
    --line:#2b313c; --accent:#7aa7ff; --chip-bg:#262c37; --chip-ink:#c3cad6;
    --btn-bg:#1b1f27;
    --read-opacity:.8;
  }
  /* 文字サイズ */
  :root[data-font="s"] { --fs:.92; }
  :root[data-font="l"] { --fs:1.12; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px 40px; }

  header { padding: 16px 4px 4px; }
  header h1 { font-size: calc(20px * var(--fs)); margin: 0; letter-spacing: .02em; }
  header .meta-head {
    color: var(--sub); font-size: calc(12px * var(--fs)); margin-top: 3px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  header .age.stale { color: #d08700; font-weight: 600; }
  header .unread { font-weight: 700; color: var(--accent); }
  header .newcount {
    font-weight: 700; color: #fff; background: #e11d48;
    border-radius: 999px; padding: 0 7px; font-size: calc(10.5px * var(--fs));
  }
  .tools { margin: 8px 0 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tool-btn {
    font-size: calc(11.5px * var(--fs)); padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub); font-weight: 600;
  }
  .tool-btn.on { border-color: var(--accent); color: var(--accent); }
  .tool-btn.danger { color: #b91c1c; border-color: #fecaca; }
  :root[data-theme="dark"] .tool-btn.danger,
  :root[data-theme="auto"] .tool-btn.danger { color: #f87171; border-color: #4b2020; }

  /* 上部のカテゴリジャンプ */
  .catnav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .catnav .nav-chip {
    flex: 0 0 auto; font-size: calc(11.5px * var(--fs)); font-weight: 700; text-decoration: none;
    color: var(--cat); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .catnav .nav-chip span { margin-left: 5px; color: var(--sub); font-weight: 600; }

  /* カテゴリ（大見出し・折りたたみ） */
  details.cat { margin: 16px 0 4px; scroll-margin-top: 8px; }
  details.cat > summary {
    cursor: pointer; list-style: none; padding: 4px 2px 6px;
    border-bottom: 2px solid var(--cat);
  }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary h2 {
    margin: 0; font-size: calc(12px * var(--fs)); font-weight: 800; letter-spacing: .08em;
    color: var(--cat); display: flex; align-items: center; gap: 6px;
  }
  details.cat > summary h2::before { content: "▾"; font-size: 11px; }
  details.cat:not([open]) > summary h2::before { content: "▸"; }
  details.cat > summary .catcount {
    margin-left: auto; font-weight: 700; color: var(--cat);
    font-size: calc(11px * var(--fs)); letter-spacing: 0;
  }
  details.cat > .body { padding-top: 4px; }

  /* テーマ（中見出し） */
  .group { margin: 12px 0 8px; }
  h3.ghead {
    display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
    font-size: calc(15px * var(--fs)); font-weight: 700;
  }
  .ghead .gname { border-left: 3px solid var(--cat); padding-left: 8px; }
  .ghead .gcount { font-size: calc(11px * var(--fs)); color: var(--sub); font-weight: 400; }
  .ghead .gnew {
    font-size: calc(10px * var(--fs)); font-weight: 700; color: #fff; background: #e11d48;
    border-radius: 999px; padding: 0 6px;
  }
  .ghead .read-all {
    margin-left: auto; font-size: calc(10.5px * var(--fs)); padding: 3px 8px;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .ghead .read-all:active { color: var(--accent); border-color: var(--accent); }

  /* 記事カード */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px;
  }
  .card a.title {
    color: var(--ink); text-decoration: none; font-size: calc(13.5px * var(--fs));
    font-weight: 600; display: block; letter-spacing: .01em; line-height: 1.4;
  }
  .card a.title:active { color: var(--accent); }
  .card .summary { color: var(--sub); font-size: calc(12px * var(--fs)); margin-top: 5px; line-height: 1.5; }

  .card.lead { border-left: 3px solid var(--cat); padding: 11px 13px; }
  .card.lead a.title { font-size: calc(15.5px * var(--fs)); line-height: 1.42; }

  /* メタ行 */
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .chip {
    font-size: calc(10px * var(--fs)); color: var(--chip-ink); background: var(--chip-bg);
    border-radius: 5px; padding: 1px 6px; font-weight: 600; white-space: nowrap;
  }
  .new {
    font-size: calc(9.5px * var(--fs)); font-weight: 800; color: #fff; background: #e11d48;
    border-radius: 4px; padding: 1px 5px; letter-spacing: .04em;
  }
  .views { font-size: calc(10px * var(--fs)); color: var(--sub); white-space: nowrap; }
  .pw { font-size: calc(10px * var(--fs)); border-radius: 5px; padding: 1px 6px; font-weight: 700; white-space: nowrap; }
  .pw.paid { color: #9a3412; background: #ffedd5; border: 1px solid #fed7aa; }
  .pw.partial { color: var(--sub); background: var(--chip-bg); border: 1px solid var(--line); font-weight: 600; }
  .card .time { font-size: calc(10.5px * var(--fs)); color: var(--sub); }
  .card:has(.pw.paid) a.title { color: var(--sub); }

  /* 既読（「既読も表示」時のみ現れる） */
  .card.read { opacity: var(--read-opacity); }
  .card.read a.title { color: var(--sub); font-weight: 500; }

  .empty { color: var(--sub); font-size: calc(12.5px * var(--fs)); padding: 6px 2px; }

  /* 動画カード：左サムネ・右タイトルの横並び */
  .card.video { padding: 0; overflow: hidden; }
  .card.video a.vlink {
    display: flex; gap: 10px; align-items: flex-start;
    text-decoration: none; color: var(--ink); padding: 8px 10px;
  }
  .card.video a.vlink:active .title { color: var(--accent); }
  .card.video .thumb { position: relative; flex: 0 0 108px; display: block; }
  .card.video .thumb img { width: 108px; height: 61px; display: block; object-fit: cover; border-radius: 6px; }
  .card.video .thumb .play {
    position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); color:#fff; font-size: 9px; border-radius: 999px;
  }
  .card.video .vtext { min-width: 0; }
  .card.video .title { display: block; font-size: calc(12.5px * var(--fs)); font-weight: 600; line-height: 1.38; }
  .card.video .meta { margin-top: 4px; }

  /* skim：初期は隠しておく余剰カード */
  .gitems:not(.expanded) > .card.extra { display: none; }
  .more-btn {
    display: block; width: 100%; margin: 2px 0 4px; padding: 6px;
    background: transparent; border: 1px dashed var(--line); border-radius: 9px;
    color: var(--cat); font-size: calc(12px * var(--fs)); font-weight: 700; cursor: pointer;
  }

  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  footer details.diag > summary { cursor: pointer; font-size: 12px; color: var(--sub); }
  footer table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  footer td { padding: 4px 6px; border-bottom: 1px dashed var(--line); color: var(--sub); }
  footer td.st-ok { color:#15803d; }
  footer td.st-ng { color:#b45309; }
  .loaderr { padding: 24px 14px; color:#b91c1c; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><h1>📰 マイニュース</h1><div class="meta-head">読み込み中…</div></header>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
