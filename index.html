<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>マイニュース</title>
<style>
  /* 明るい配色（既定） */
  :root {
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --cat:#2563eb;
    --found-bg:#ede9fe; --found-ink:#6d28d9;
    --chip-bg:#eef0f3; --chip-ink:#374151; --btn-bg:#fff;
    --read-opacity:.5;
    --videos-bg:#fdf2f2;   /* 動画ブロックの下地（記事と見分けるため） */
    --pick-bg:#eff6ff;     /* 選択中のカード */
    --up:#b91c1c; --down:#1d4ed8;   /* 株価の上げ・下げ（日本の慣習で上げは赤） */
    --role-long:#0f766e; --role-perk:#b45309;   /* ウォッチ銘柄の役割の札（長期保有・優待） */
    --field-bg:#dcfce7; --field-ink:#166534;    /* ほかの分野からの分野の札（コントラスト比 6.49） */
    /* ウォッチ銘柄の位置の色（安い側＝緑・高い側＝橙。株価の位置と利回りの位置で同じ意味）。
       文字は白地で 5.02・5.18。帯は棒の3つの区間の薄い色 */
    --zlo:#15803d; --zhi:#c2410c; --zlo-bg:#bbf7d0; --zhi-bg:#fed7aa;
    /* ホイミの HP の色（51以上・26〜50・25以下）。文字は白地で 5.02・5.18・6.47、灰色の地で 4.56〜5.88（v1.47.0） */
    --hp-ok:#15803d; --hp-mid:#c2410c; --hp-low:#b91c1c;
    /* ホイミの職場向けの色（文字は白地で 6.04、薄い地で 5.53） */
    --work-ink:#be185d; --work-bg:#fdf2f8;
    /* ふり返りの組ごとの色（体・息と五感・頭と心・職場向け）。色覚の違いでも隣どうしを見分けられることを
       検査の式で確かめた。白地とのコントラストが低い色があるので、下に組の名前と回数を必ず書く */
    --k-body:#2a78d6; --k-sense:#1baf7a; --k-mind:#6250d6; --k-work:#e87ba4;
    --fs:1;           /* 文字サイズの倍率 */
  }
  /* 端末が暗い設定のとき（手動指定が無い＝自動のとき）だけ暗くする */
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg:#111318; --card:#1b1f27; --ink:#e8eaed; --sub:#9aa3af;
      --line:#2b313c; --accent:#7aa7ff; --chip-bg:#262c37; --chip-ink:#c3cad6;
    --found-bg:#332b4d; --found-ink:#c4b5fd;
      --btn-bg:#1b1f27;
      --read-opacity:.8;
      --videos-bg:#1a1416;
      --pick-bg:#16233a;
      --up:#f87171; --down:#93c5fd;
      --role-long:#5eead4; --role-perk:#fbbf24;
      --field-bg:#14301f; --field-ink:#86efac;   /* コントラスト比 10.16 */
      --zlo:#4ade80; --zhi:#fb923c; --zlo-bg:#14532d; --zhi-bg:#7c2d12;   /* 文字は 9.48・7.30 */
      --hp-ok:#4ade80; --hp-mid:#fb923c; --hp-low:#f87171;   /* 文字は 9.48・7.30・5.97 */
      --work-ink:#f9a8d4; --work-bg:#3a1a2c;                 /* 文字は 9.10・8.49 */
      --k-body:#3987e5; --k-sense:#199e70; --k-mind:#9085e9; --k-work:#d55181;
    }
  }
  /* 手動で「暗い」を選んだとき */
  :root[data-theme="dark"] {
    --bg:#111318; --card:#1b1f27; --ink:#e8eaed; --sub:#9aa3af;
    --line:#2b313c; --accent:#7aa7ff; --chip-bg:#262c37; --chip-ink:#c3cad6;
    --found-bg:#332b4d; --found-ink:#c4b5fd;
    --btn-bg:#1b1f27;
    --read-opacity:.8;
    --videos-bg:#1a1416;
    --pick-bg:#16233a;
    --up:#f87171; --down:#93c5fd;
    --role-long:#5eead4; --role-perk:#fbbf24;
    --field-bg:#14301f; --field-ink:#86efac;
    --zlo:#4ade80; --zhi:#fb923c; --zlo-bg:#14532d; --zhi-bg:#7c2d12;
    --hp-ok:#4ade80; --hp-mid:#fb923c; --hp-low:#f87171;
    --work-ink:#f9a8d4; --work-bg:#3a1a2c;
    --k-body:#3987e5; --k-sense:#199e70; --k-mind:#9085e9; --k-work:#d55181;
  }
  /* 文字サイズ */
  :root[data-font="s"] { --fs:.92; }
  :root[data-font="l"] { --fs:1.12; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px 40px; }

  header { padding: 16px 4px 4px; }
  header h1 { font-size: calc(20px * var(--fs)); margin: 0; letter-spacing: .02em; }
  header .meta-head {
    color: var(--sub); font-size: calc(12px * var(--fs)); margin-top: 3px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  header .age.stale { color: #d08700; font-weight: 600; }
  /* 今日読むべき「新着」を主役に。貯まっている「未読」は控えめに添える。 */
  header .newcount {
    font-weight: 800; color: #111827; background: #f59e0b;
    border-radius: 999px; padding: 1px 9px; font-size: calc(12.5px * var(--fs));
  }
  header button.newcount { border: 0; cursor: pointer; }
  header button.newcount.on {
    background: var(--btn-bg); color: var(--accent);
    border: 1px solid var(--accent); font-weight: 700;
  }
  header .nonew { font-weight: 700; color: var(--sub); font-size: calc(12px * var(--fs)); }
  /* 新着画面で、そのテーマがどのカテゴリのものか分かるように */
  .ghead .gcat {
    margin-left: auto; font-size: calc(10px * var(--fs)); font-weight: 600;
    color: var(--sub); background: var(--chip-bg); border-radius: 999px; padding: 1px 8px;
  }
  header .unread { font-weight: 500; color: var(--sub); font-size: calc(11px * var(--fs)); }
  /* 取れなかったフィードの知らせ。目立つが邪魔にならない大きさに留める */
  .trouble {
    font-size: calc(10.5px * var(--fs)); font-weight: 700; cursor: pointer;
    color: #92400e; background: #fef3c7; border: 1px solid #fde68a;
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  :root[data-theme="dark"] .trouble, :root[data-theme="auto"] .trouble {
    color: #fcd34d; background: #3a2d10; border-color: #5b4818;
  }
  /* テーマの並べ替え（設定の中） */
  .orderbox {
    margin: 4px 0 8px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); font-size: calc(12px * var(--fs));
  }
  .orderbox h4 {
    margin: 8px 0 4px; font-size: calc(11px * var(--fs)); color: var(--sub);
    letter-spacing: .04em;
  }
  .orderbox h4:first-child { margin-top: 0; }
  .orow {
    display: flex; align-items: center; gap: 6px; padding: 3px 0;
    border-bottom: 1px dotted var(--line);
  }
  .orow span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .orow .tool-btn { padding: 2px 8px; min-width: 34px; }
  .orow .tool-btn[disabled] { opacity: .3; }
  .orderbox p { margin: 8px 0 6px; color: var(--sub); }

  .trouble-list {
    flex-basis: 100%; margin-top: 6px; padding: 8px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    font-size: calc(11.5px * var(--fs)); color: var(--sub);
  }
  .trouble-list p { margin: 0 0 6px; }
  .trouble-list table { width: 100%; border-collapse: collapse; }
  .trouble-list td {
    padding: 3px 4px; border-bottom: 1px dashed var(--line);
    font-size: calc(11px * var(--fs)); vertical-align: top;
  }

  .tools { margin: 8px 0 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tool-btn {
    font-size: calc(11.5px * var(--fs)); padding: 5px 12px; min-height: 36px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub); font-weight: 600;
  }
  .tool-btn.on { border-color: var(--accent); color: var(--accent); }
  .tool-btn.danger { color: #b91c1c; border-color: #fecaca; }
  :root[data-theme="dark"] .tool-btn.danger,
  :root[data-theme="auto"] .tool-btn.danger { color: #f87171; border-color: #4b2020; }

  /* 設定（毎日は使わないものを畳む） */
  .settings {
    margin: 6px 0 2px; padding: 6px 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line);
  }
  .settings .srow {
    display: flex; align-items: center; gap: 10px; padding: 5px 0;
    font-size: calc(12px * var(--fs)); color: var(--sub);
  }
  .settings .srow span { flex: 1 1 auto; }
  /* 項目名の下に添える小さな説明（記録の件数など） */
  .settings .srow span small {
    display: block; font-size: calc(10.5px * var(--fs)); color: var(--sub); opacity: .85;
  }
  /* 記録の控え：説明が長いので、スマホ幅ではボタンを下の段へ（ボタンの文字が途中で折れないように） */
  .settings .srow.backup { flex-wrap: wrap; row-gap: 6px; }
  .settings .srow.backup span { flex-basis: 100%; }
  .settings .srow.backup .tool-btn { white-space: nowrap; }
  /* 記録を読み込む前の確認（今の端末とファイルの件数を並べる） */
  .import-box td:nth-child(n+2) { text-align: right; white-space: nowrap; }
  .import-box b { color: var(--ink); }
  .import-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  /* テーマごとの「読めない記事を既読に」 */
  .ghead .lock-btn { /* 旧：テーマごとの鍵ボタン（設定の切り替えに統合したため未使用） */
    margin-left: auto; font-size: calc(11px * var(--fs)); padding: 7px 13px;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap;
    min-height: 34px; display: inline-flex; align-items: center;
  }
  .ghead .lock-btn + .read-all { margin-left: 0; }
  h3.ghead { gap: 10px; }

  /* 上部のカテゴリジャンプ */
  .catnav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .catnav .nav-chip {
    flex: 0 0 auto; font-size: calc(11.5px * var(--fs)); font-weight: 700; text-decoration: none;
    color: var(--cat); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .catnav .nav-chip span { margin-left: 5px; color: var(--sub); font-weight: 500; font-size: calc(10.5px * var(--fs)); }
  .catnav .nav-chip .navnew {
    margin-left: 5px; padding: 0 6px; border-radius: 999px;
    background: #f59e0b; color: #111827; font-weight: 800;
  }

  /* カテゴリ（大見出し・折りたたみ） */
  details.cat { margin: 16px 0 4px; scroll-margin-top: 8px; }
  details.cat > summary {
    cursor: pointer; list-style: none; padding: 4px 2px 6px;
    border-bottom: 2px solid var(--cat);
  }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary h2 {
    margin: 0; font-size: calc(12px * var(--fs)); font-weight: 800; letter-spacing: .08em;
    color: var(--cat); display: flex; align-items: center; gap: 6px;
  }
  details.cat > summary h2::before { content: "▾"; font-size: 11px; }
  details.cat:not([open]) > summary h2::before { content: "▸"; }
  details.cat > summary .catcount {
    margin-left: auto; font-weight: 500; color: var(--sub);
    font-size: calc(10.5px * var(--fs)); letter-spacing: 0;
    display: flex; align-items: center; gap: 6px;
  }
  details.cat > summary .catnew {
    padding: 0 7px; border-radius: 999px; font-size: calc(11px * var(--fs));
    background: #f59e0b; color: #111827; font-weight: 800;
    font-size: calc(10.5px * var(--fs));
  }
  details.cat > .body { padding-top: 4px; }

  /* 「ときどき見る」テーマ。カテゴリの下部に、畳んで置く */
  .minor-sep {
    display: flex; align-items: center; gap: 8px;
    margin: 16px 2px 8px; color: var(--sub); font-size: calc(10.5px * var(--fs));
  }
  .minor-sep::before, .minor-sep::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .minor-sep span { white-space: nowrap; letter-spacing: .06em; }
  details.cat.minorbox { margin: 6px 0; }
  details.cat.minorbox > summary { border-bottom: 1px dashed var(--line); padding: 6px 2px; }
  details.cat.minorbox > summary h2 {
    font-size: calc(13px * var(--fs)); font-weight: 700; letter-spacing: 0;
    color: var(--ink);
  }
  details.cat.minorbox > summary h2::before { color: var(--sub); }
  details.cat.minorbox > .body { padding-top: 6px; }

  /* テーマ（中見出し） */
  .group { margin: 12px 0 8px; }
  h3.ghead {
    display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
    font-size: calc(15px * var(--fs)); font-weight: 700;
  }
  /* テーマ名は押すと最小化できる。押せることが分かる見た目にする */
  .ghead .gname {
    border-left: 3px solid var(--cat); padding: 2px 0 2px 8px;
    background: transparent; border-top: 0; border-right: 0; border-bottom: 0;
    color: var(--ink); font-size: inherit; font-weight: inherit; font-family: inherit;
    cursor: pointer; text-align: left;
  }
  .ghead .gname:active { color: var(--accent); }
  .group.folded { margin: 6px 0; }
  .group.folded h3.ghead { margin: 0; }
  .ghead .gcount { font-size: calc(11px * var(--fs)); color: var(--sub); font-weight: 400; }
  .ghead .gnew {
    font-size: calc(11px * var(--fs)); font-weight: 800; color: #111827; background: #f59e0b;
    border-radius: 999px; padding: 0 6px;
  }
  /* 指で押し分けられる大きさに。24px角では隣と押し間違える。 */
  .ghead .read-all {
    margin-left: auto; font-size: calc(11px * var(--fs)); padding: 7px 13px;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap;
    min-height: 34px; display: inline-flex; align-items: center;
  }
  .ghead .read-all:active { color: var(--accent); border-color: var(--accent); }

  .tool-btn.star.on { border-color: #f59e0b; color: #b45309; }
  :root[data-theme="dark"] .tool-btn.star.on,
  :root[data-theme="auto"] .tool-btn.star.on { color: #fbbf24; }

  /* 天気（見出しの下） */
  .weather {
    margin-top: 8px; padding: 7px 10px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line);
    font-size: calc(12.5px * var(--fs)); color: var(--ink);
  }
  .weather .wplace {
    font-size: calc(10.5px * var(--fs)); font-weight: 800;
    letter-spacing: .08em; color: var(--sub); margin-bottom: 2px;
  }
  .weather .wrow { display: flex; align-items: center; gap: 7px; padding: 2px 0; flex-wrap: wrap; }
  .weather .wrow b { font-weight: 700; color: var(--sub); min-width: 2.4em; }
  .weather .wicon { font-size: calc(15px * var(--fs)); line-height: 1; }
  .weather .wtext { flex: 1 1 auto; min-width: 6em; }
  .weather .wtemp { font-weight: 700; font-variant-numeric: tabular-nums; }
  .weather .wpops { margin-left: auto; display: inline-flex; gap: 6px; white-space: nowrap; }
  .weather .wpop {
    font-size: calc(11px * var(--fs)); color: var(--sub); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .weather .wpop.strong { color: #1d4ed8; font-weight: 700; }
  /* 天気の下に添える株価のひと目行（本体は最下部） */
  /* 1段目＝保有の合計（保有株を読み込んだ端末だけ）、2段目＝利回りが10年で高い3銘柄（CODE_TASK_08 ⑦）。
     名前が長い日は2段目が折り返す */
  .weather .wstocks {
    display: flex; flex-direction: column; gap: 3px; margin-top: 6px; padding-top: 6px;
    border-top: 1px dashed var(--line); text-decoration: none; color: var(--ink);
    font-size: calc(11.5px * var(--fs));
  }
  .weather .wrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
  .weather .wlb { font-weight: 700; color: var(--sub); font-size: calc(10.5px * var(--fs)); }
  .weather .wlb.z-lo { color: var(--zlo); }
  .weather .wst b { font-weight: 600; color: var(--sub); margin-right: 4px; }
  .weather .wst i { font-style: normal; font-weight: 700; margin-left: 5px; }
  .weather .wst i.z-lo { color: var(--zlo); }
  .weather .wst i.z-hi { color: var(--zhi); }
  /* 上げ・下げの色は変数で切り替える（以前は「自動」のとき明るい画面でも暗い画面用の淡い色になり、読みにくかった） */
  .weather .wst i.up { color: var(--up); }
  .weather .wst i.down { color: var(--down); }
  :root[data-theme="dark"] .weather .wpop.strong,
  :root[data-theme="auto"] .weather .wpop.strong { color: #93c5fd; }

  /* 記事の古さの区切り（NEWバッジとは役割が違う） */
  /* テーマの入口リンク（𝕏 情報局・TVer など） */
  .glinks { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .glink {
    display: inline-block; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--ink);
    font-size: calc(11.5px * var(--fs)); text-decoration: none;
  }
  .glink:active { border-color: var(--accent); }

  /* 小分類の目次（設定・工夫／自動化…）。押すとその分類だけ開く */
  .secrow {
    display: flex; align-items: center; gap: 8px; width: 100%;
    margin: 4px 0; padding: 9px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: calc(12.5px * var(--fs)); font-weight: 700; text-align: left;
  }
  .secrow i { margin-left: auto; font-style: normal; font-weight: 400; color: var(--sub); }
  .secrow.open { border-color: var(--accent); }
  .secrow.hasnew { border-left: 4px solid var(--accent); }

  /* 目次（閉じたテーマ）：新着のあるテーマだけ目立たせる */
  .group.folded { opacity: .72; }
  .group.folded.hasnew { opacity: 1; }
  .group.folded.hasnew .ghead .gname { border-left-width: 5px; }
  /* 目次ではテーマの行全体を押せるように（目安44px） */
  .group.folded .ghead .gname { flex: 1; min-height: 44px; display: flex; align-items: center; gap: 4px; }

  .agesep {
    display: flex; align-items: center; gap: 8px;
    margin: 10px 2px 8px; color: var(--sub); font-size: calc(10.5px * var(--fs));
  }
  .agesep::before, .agesep::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .agesep span { white-space: nowrap; letter-spacing: .04em; }

  /* 読み終えたテーマ（消さずに戻り道を残す） */
  .group.done .empty { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .reread-btn {
    padding: 4px 10px; border-radius: 999px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--cat);
    font-size: calc(11.5px * var(--fs));
  }

  /* 版と更新履歴 */
  footer.ver { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 10px; }
  footer.ver summary {
    cursor: pointer; font-size: calc(11.5px * var(--fs)); color: var(--sub);
  }
  footer.ver table.vlog { width: 100%; border-collapse: collapse; margin-top: 8px; }
  footer.ver table.vlog td {
    padding: 4px 6px; border-bottom: 1px dashed var(--line);
    color: var(--sub); font-size: calc(11px * var(--fs)); vertical-align: top;
  }
  footer.ver table.vlog td:first-child { font-weight: 700; white-space: nowrap; }
  footer.ver table.vlog td:nth-child(2) { white-space: nowrap; }

  /* ウォッチ銘柄（記事とは別のブロック） */
  .stocks {
    margin: 10px 0 4px; padding: 8px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  .stocks h2 {
    margin: 0 0 4px; font-size: calc(11px * var(--fs)); font-weight: 800;
    letter-spacing: .08em; color: var(--sub);
  }
  /* 見出しの行（右に「ⓘ 見方」の入口） */
  .stocks .shtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 2px; }
  .stocks .shtop h2 { margin: 0; }
  .stocks .slg-btn { padding: 2px 10px; min-height: 28px; font-size: calc(11px * var(--fs)); }
  /* 表の見方（凡例）。左に見本、右に意味。下地は白のまま（灰色の下地だと小さな文字が読みにくい） */
  .stocks .slegend {
    display: grid; gap: 6px; margin: 0 0 8px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    font-size: calc(11px * var(--fs)); line-height: 1.5;
  }
  /* 見本の幅は、いちばん長い見本（○株・取得○円）が収まる幅にそろえる */
  .stocks .slg-row { display: grid; grid-template-columns: 7.6em 1fr; gap: 8px; align-items: baseline; }
  .stocks .slg-s {
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stocks .slg-s .srole { margin-left: 0; }
  .stocks .slg-s .srange { width: 36px; margin: 0 2px; }   /* 見本の棒は短く（1行に収める） */
  .stocks .slg-s.bar { flex-wrap: nowrap; }
  /* 高値・安値の期間の切り替え（1・3・5・10年。全銘柄いっしょ） */
  .stocks .sspan {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 2px 0 6px;
    font-size: calc(11px * var(--fs)); color: var(--sub);
  }
  .stocks .sspan .tool-btn { padding: 3px 10px; min-height: 32px; }
  .stocks .sname { font-weight: 600; }
  /* ウォッチ銘柄の表（CODE_TASK_08 ⑤）。4列とも2段：上に主な数字、下に小さく補足。
     列の幅を決めて固定し（table-layout: fixed）、29銘柄で数字の位置をそろえる。名前が長ければ折り返す */
  .stocks .ssort { margin: 2px 0 2px; font-size: calc(11px * var(--fs)); color: var(--sub); }
  .stocks .ssort b { color: var(--ink); }
  .stocks .ssort small { margin-left: 4px; }
  .stocks .stab {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-size: calc(13px * var(--fs)); font-variant-numeric: tabular-nums;
  }
  /* 名前の列を広めに（9文字ほどの名前を折り返さないように）。位置の列は棒と3文字の言葉が入る幅 */
  .stocks .stab col.c-n { width: 36%; }
  .stocks .stab col.c-p { width: 21%; }
  .stocks .stab col.c-y { width: 16%; }
  .stocks .stab col.c-z { width: 27%; }
  /* 表の書式は、この表の行だけにかける（「>」で区切る。詳細の中の小さな表に乗らないように） */
  .stocks .stab > thead > tr > th { padding: 0; border-bottom: 1px solid var(--line); }
  /* 見出しは押して並べ替えるボタン（押しやすい高さ 36px）。いまの並びの列は色と下線 */
  .stocks .ssort-btn {
    display: block; width: 100%; min-height: 36px; padding: 2px 3px; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: calc(11px * var(--fs)); font-weight: 600; color: var(--sub); text-align: right;
  }
  .stocks .stab th:first-child .ssort-btn { text-align: left; }
  .stocks .ssort-btn.on { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .stocks .stab > tbody > tr > td { padding: 5px 3px; vertical-align: top; text-align: right; overflow-wrap: anywhere; }
  .stocks .stab > tbody > tr > td.sn { text-align: left; }
  .stocks .stab > tbody > tr > td > b { font-weight: 700; }
  .stocks .stab > tbody > tr > td > small { display: block; font-size: calc(10.5px * var(--fs)); color: var(--sub); font-weight: 600; }
  .stocks .stab > tbody > tr > td > small.up { color: var(--up); }     /* 日本の慣習に合わせ、上げは赤 */
  .stocks .stab > tbody > tr > td > small.down { color: var(--down); }
  .stocks .stab td.sn .srole { display: table; margin: 2px 0 0 1.2em; }
  .stocks .stab tbody.sitem > tr.shead > td { border-top: 1px dashed var(--line); }
  .stocks .stab tbody.sitem:first-of-type > tr.shead > td,
  .stocks .stab tbody.ssec + tbody.sitem > tr.shead > td { border-top: 0; }
  .stocks .sitem.muted .sy b { color: var(--sub); font-weight: 400; }   /* 長期保有・優待は高配当の物差しで見ない */
  /* 位置の列：棒と区分の言葉を1行に、下に高値からの下がり幅 */
  .stocks .spos { display: flex; align-items: center; justify-content: flex-end; gap: 4px; white-space: nowrap; }
  .stocks .spos b { font-size: calc(11.5px * var(--fs)); }
  .z-lo { color: var(--zlo); }
  .z-hi { color: var(--zhi); }
  /* 保有している銘柄の下の行（株数・取得単価・取得利回り・損益） */
  .stocks .stab > tbody > tr.shold > td {
    padding: 0 3px 5px 1.2em; text-align: left;
    font-size: calc(11px * var(--fs)); color: var(--sub);
  }
  .stocks .stab tr.shold span { display: inline-block; margin-right: 10px; }
  .stocks .stab tr.shold b { color: var(--ink); }
  .stocks .stab > tbody > tr.sdrow > td { padding: 0 0 6px; text-align: left; }
  .stocks .up { color: var(--up); font-weight: 700; }
  .stocks .down { color: var(--down); font-weight: 700; }
  /* 保有株の合計（この端末だけ） */
  .stocks .stotal {
    margin: 2px 0 6px; padding: 6px 8px; border-radius: 8px; background: var(--chip-bg);
    font-size: calc(12px * var(--fs)); font-variant-numeric: tabular-nums;
  }
  .stocks .stotal small { display: block; margin-top: 3px; color: var(--sub); font-size: calc(10.5px * var(--fs)); }
  /* 「持っている」「気になる」の区切り（表の中の1行） */
  .stocks .stab tbody.ssec td {
    padding: 10px 3px 2px; text-align: left; border-bottom: 1px solid var(--line);
    font-size: calc(11.5px * var(--fs)); font-weight: 800; color: var(--sub);
  }
  .stocks .stab tbody.ssec i { font-style: normal; font-weight: 400; margin-left: 6px; }
  /* 選んだ期間の安値〜高値の棒と、いまの位置の点。棒は3つの区間に薄く色を分け（左＝安値圏の緑、右＝高値圏の橙。CODE_TASK_08 ⑥）、
     点も区間の色にする。棒の幅は全行で同じ（点の位置だけで見比べられるように） */
  .stocks .srange {
    position: relative; display: inline-block; flex: none; width: 44px; height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--zlo-bg) 0 33.3%, var(--line) 33.3% 66.7%, var(--zhi-bg) 66.7% 100%);
  }
  .stocks .srange i {
    position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: var(--sub); border: 2px solid var(--card);
  }
  .stocks .srange i.z-lo { background: var(--zlo); }
  .stocks .srange i.z-hi { background: var(--zhi); }
  /* 役割の札（行では見せるだけ。替えるのは詳細の中の札） */
  .stocks .srole {
    margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    font-size: calc(10px * var(--fs)); font-weight: 600; white-space: nowrap;
  }
  /* 既定の「高配当」は全行に出るので、行では枠を消して控えめにする */
  .stocks .srole.r-div { border-color: transparent; opacity: .75; }
  .stocks .srole.r-long { color: var(--role-long); border-color: var(--role-long); }
  .stocks .srole.r-perk { color: var(--role-perk); border-color: var(--role-perk); }
  /* 銘柄の行（押すと詳細が開く）。▸ は開ける印、開いているときは ▾ */
  .stocks .shead { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stocks .scaret {
    display: inline-block; width: 1em; font-style: normal; font-weight: 400;
    color: var(--sub); font-size: calc(10px * var(--fs));
  }
  .stocks .sitem.open .sname { color: var(--accent); }
  /* 詳細（行の下に開く）。下地は白のまま枠と左の線で区切る
     （灰色の下地に灰色の小さな文字＝年月は、明るい配色で 4.23:1 と読みにくい。白なら 4.83:1） */
  .stocks .sdetail {
    margin: 4px 0 4px 1em; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    font-size: calc(11.5px * var(--fs)); font-variant-numeric: tabular-nums;
  }
  .stocks .sdtab { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .stocks .sdtab th {
    text-align: right; font-weight: 600; color: var(--sub); font-size: calc(10.5px * var(--fs));
    padding: 0 4px 2px; border-bottom: 1px solid var(--line);
  }
  .stocks .sdtab td { text-align: right; padding: 3px 4px; vertical-align: top; }
  .stocks .sdtab th:first-child, .stocks .sdtab td:first-child { text-align: left; white-space: nowrap; }
  .stocks .sdtab td small { display: block; color: var(--sub); font-size: calc(10px * var(--fs)); }
  /* 表の上で選んでいる期間の行（太字と、期間の左の印） */
  .stocks .sdtab tr.on td { font-weight: 700; }
  .stocks .sdtab tr.on td:first-child { box-shadow: inset 3px 0 var(--accent); padding-left: 7px; }
  /* 隣り合う期間で同じ安値・高値をつないだマス。右の縦線で、どの期間までが同じ値かを示す */
  .stocks .sdtab td.join { box-shadow: inset -2px 0 var(--sub); padding-right: 8px; }
  .stocks .sdtab td.join.on { font-weight: 700; }
  .stocks .sddiv { display: grid; gap: 2px; margin-bottom: 8px; }
  .stocks .sddiv b { color: var(--ink); }
  .stocks .sdh { font-weight: 600; }
  .stocks .sdh small, .stocks .sdrole small { color: var(--sub); font-size: calc(10px * var(--fs)); font-weight: 400; }
  /* 詳細の中の小さな表（過去1年の配当の内訳・1年ごとの配当。CODE_TASK_08 ⑤）。幅は中身に合わせる */
  .stocks .sdtab.sdmini { width: auto; min-width: 70%; margin: 2px 0 4px; }
  /* 利回りの10年と1年ごとの配当（CODE_TASK_05 ⑥）。減った年は青（株価の下げと同じ色）、多い年は＊ */
  .stocks .sdyld { display: grid; gap: 2px; margin-bottom: 8px; }
  .stocks .sdyld b { color: var(--ink); }
  .stocks .sdyld b.z-lo { color: var(--zlo); }   /* 利回りの水準の言葉は位置の色（CODE_TASK_08 ⑥） */
  .stocks .sdyld b.z-hi { color: var(--zhi); }
  .stocks .sdyld .sdh { margin-top: 4px; }
  .stocks .sdyld .dn, .stocks .sdyld .dn b { color: var(--down); }
  .stocks .sdnote { color: var(--sub); font-size: calc(10.5px * var(--fs)); }
  .stocks .sdrole { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 8px; }
  /* 詳細の中の札は押して替えるので、押しやすい大きさにし、高配当にも枠を付ける */
  .stocks .sdrole .srole { margin-left: 0; min-height: 32px; padding: 2px 12px; cursor: pointer; font-size: calc(11.5px * var(--fs)); }
  .stocks .sdrole .srole.r-div { border-color: var(--sub); opacity: 1; color: var(--ink); }
  .stocks .slinks { display: flex; flex-wrap: wrap; gap: 6px; }
  .stocks .slinks a {
    display: inline-flex; flex-direction: column; justify-content: center; min-height: 40px;
    padding: 4px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--card);
    color: var(--accent); font-weight: 600; text-decoration: none;
  }
  .stocks .slinks a small { color: var(--sub); font-weight: 400; font-size: calc(10px * var(--fs)); }
  /* 書き出しの「保有株も入れる」 */
  .hold-opt { display: inline-flex; align-items: center; gap: 4px; font-size: calc(11.5px * var(--fs)); white-space: nowrap; }

  /* 選んでまとめて既読にする */
  .card.picking { cursor: pointer; }
  .pick {
    position: absolute; top: 4px; right: 6px;
    font-size: calc(17px * var(--fs)); color: var(--sub); line-height: 1;
  }
  .pick.on { color: var(--accent); }
  .pickspacer { height: 56px; }
  .pickbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--card);
    border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(0,0,0,.14);
    font-size: calc(12.5px * var(--fs)); font-weight: 700;
  }
  .pickbar #pick-count { flex: 1 1 auto; color: var(--sub); }
  .pick-btn {
    padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 700;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    font-size: calc(12.5px * var(--fs)); white-space: nowrap;
  }
  .pick-btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 選択中であることが一目で分かるように、カード全体に色を敷く */
  .card.picked { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--pick-bg); }

  /* 記事カード */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px;
    position: relative;   /* ★ボタンを右上に置くため */
  }

  /* 指で払って仕分ける。
     touch-action: pan-y は「縦の送りはブラウザに任せ、横はこちらで扱う」の意味。
     これを書かないと、横に払っても画面が一緒に動いてしまう。 */
  .card { touch-action: pan-y; }
  .card.swiping { transition: none; will-change: transform; }
  .card.sw-out { transition: transform .18s ease, opacity .18s ease; }

  /* いま何が起きるかを画面上部に出す（払っている最中だけ） */
  #swipe-hint {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
    padding: 7px 14px; border-radius: 999px; pointer-events: none;
    font-size: 12.5px; font-weight: 700;
    background: var(--card); color: var(--sub); border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  #swipe-hint.read.ready { background: #15803d; color: #fff; border-color: #15803d; }
  #swipe-hint.fav.ready { background: #b45309; color: #fff; border-color: #b45309; }

  /* 取り消しの案内。指1本で消せてしまうので、必ず戻り道を出す */
  #toast {
    position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 12px;
    background: var(--ink); color: var(--bg);
    font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,0,0,.28);
  }
  #toast span { flex: 1 1 auto; }
  #toast .more { display: block; font-style: normal; font-weight: 500; opacity: .75; font-size: 11px; }

  /* 設定の中の使い方 */
  .settings .howto { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .settings .howto summary {
    cursor: pointer; font-size: calc(12px * var(--fs)); color: var(--sub); font-weight: 700;
  }
  .settings .howto ul { margin: 8px 0 2px; padding-left: 1.2em; }
  .settings .howto li {
    margin-bottom: 6px; font-size: calc(11.5px * var(--fs)); color: var(--sub); line-height: 1.6;
  }
  .settings .howto b { color: var(--ink); }
  #toast button {
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid currentColor; background: transparent; color: inherit;
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }

  /* ★お気に入り。リンクの外側に置くので、押しても記事は開かない */
  .fav {
    position: absolute; top: 0; right: 0; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border: 0; background: transparent; cursor: pointer;
    color: var(--sub); font-size: calc(15px * var(--fs)); line-height: 1;
  }
  .fav.on { color: #f59e0b; }
  .card a.title, .card.video .vtext .title { padding-right: 26px; }
  .card a.title {
    color: var(--ink); text-decoration: none; font-size: calc(14.5px * var(--fs));
    font-weight: 600; display: block; letter-spacing: .01em; line-height: 1.45;
  }
  .card a.title:active { color: var(--accent); }
  .card .summary { color: var(--sub); font-size: calc(12px * var(--fs)); margin-top: 5px; line-height: 1.5; }

  .card.lead { border-left: 3px solid var(--cat); padding: 11px 13px; }
  .card.lead a.title { font-size: calc(15.5px * var(--fs)); line-height: 1.42; }

  /* メタ行 */
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .chip {
    font-size: calc(11px * var(--fs)); color: var(--chip-ink); background: var(--chip-bg);
    border-radius: 5px; padding: 1px 6px; font-weight: 600; white-space: nowrap;
  }
  /* ---- 朝刊（トップの「きょうの新着」）---- */
  .morning {
    margin: 10px 0 4px; padding: 12px 12px 10px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent);
  }
  .morning .mhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .morning h2 { margin: 0; font-size: calc(17px * var(--fs)); }
  .morning .mcount { font-size: calc(20px * var(--fs)); font-weight: 800; color: var(--accent); }
  /* 朝刊の行の並べ替え（v1.37.0）。見出しの右端のボタンから入る */
  .morning .mhead .marr-btn { margin-left: auto; align-self: center; padding: 3px 12px; min-height: 34px; white-space: nowrap; }
  .morning .marr-note { font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--accent); }
  .marr-help { margin: 2px 0 6px; font-size: calc(11.5px * var(--fs)); color: var(--sub); }
  .marr-row .mname { cursor: default; }
  .marr-row .tool-btn { min-width: 44px; min-height: 40px; padding: 0 10px; font-size: calc(13px * var(--fs)); }
  .marr-row .tool-btn[disabled] { opacity: .3; }
  .mnum.zero { color: var(--sub); font-weight: 400; }
  .marr-reset { display: block; margin: 10px 0 4px; }
  .mtheme { border-top: 1px solid var(--line); }
  .mtheme.open { padding-bottom: 6px; }
  .mrow { display: flex; align-items: center; gap: 8px; min-height: 46px; }
  .mname {
    flex: 1; display: flex; align-items: center; gap: 6px; min-height: 46px; padding: 0;
    border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left;
    font-size: calc(14.5px * var(--fs)); font-weight: 700;
  }
  .mcaret { color: var(--sub); width: 1em; }
  .mnum { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
  /* 片づけは控えめな文字ボタン（押せる範囲は広く） */
  .mtidy {
    min-height: 36px; padding: 0 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    font-size: calc(12px * var(--fs)); font-weight: 600; white-space: nowrap;
  }
  .mtidy:active { border-color: var(--accent); color: var(--accent); }
  .mfound {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 46px;
    margin-top: 6px; padding: 0 10px; border-radius: 10px; cursor: pointer; text-align: left;
    border: 1px solid var(--found-ink); background: var(--found-bg); color: var(--found-ink);
    font-size: calc(13.5px * var(--fs)); font-weight: 700;
  }
  .mfound b { white-space: nowrap; }   /* 「発掘 ○件（うちきょう○）」は途中で折り返さない */
  .mfound small { font-weight: 400; opacity: .85; font-size: calc(11px * var(--fs)); }
  .mfound i { margin-left: auto; font-style: normal; }
  .mtidyall {
    width: 100%; min-height: 44px; margin-top: 8px; border-radius: 10px; cursor: pointer;
    border: 1px dashed var(--line); background: transparent; color: var(--sub);
    font-size: calc(12.5px * var(--fs)); font-weight: 700;
  }
  .mdone { padding: 8px 2px 4px; font-weight: 700; color: var(--sub); }
  /* ホイミ（新着をすべて確認したあとの、1〜2分のひと休み。v1.45.0）。ニュースより目立たせない */
  .hoimi {
    margin: 8px 0 2px; padding: 8px 10px; border-radius: 10px;
    border: 1px dashed var(--line); color: var(--sub); font-size: calc(12.5px * var(--fs));
  }
  .hoimi .hlabel { font-size: calc(11px * var(--fs)); font-weight: 700; }
  .hoimi div.hlabel { display: flex; align-items: baseline; gap: 8px; }
  .hoimi .hn { margin-left: auto; font-weight: 700; white-space: nowrap; }   /* 「今日 ○回」は右端に */
  /* 1つずつ1行。項目名が長いときは折り返し、［できた］は右端にそろえる。
     ボタンは高さ・幅とも44px以上。上下の［できた］の間は行の余白で12px（CODE_TASK_11 ②） */
  .hoimi .hrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .hname { flex: 1 1 auto; min-width: 0; color: var(--ink); font-size: calc(13.5px * var(--fs)); font-weight: 700; }
  /* 項目名の下の一言の説明（CODE_TASK_11 ③） */
  .hdesc { display: block; margin-top: 1px; color: var(--sub); font-size: calc(11.5px * var(--fs)); font-weight: 400; line-height: 1.4; }
  /* 4つ目（職場向け）は色の付いた枠と札で、前の3つと区別する（CODE_TASK_11 ⑥） */
  .hoimi .hrow.work {
    flex-wrap: wrap; row-gap: 0; margin-top: 8px; padding: 6px 8px; border: 0;
    border-left: 4px solid var(--work-ink); border-radius: 6px; background: var(--work-bg);
  }
  .wtag { flex-basis: 100%; color: var(--work-ink); font-size: calc(11px * var(--fs)); font-weight: 700; }
  /* ［ほかの3つにする］は［できた］の列から16px離し、枠だけの灰色にして見た目を変える */
  .hoimi .hbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .hbtn {
    min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--sub); font-family: inherit;
    font-size: calc(12.5px * var(--fs)); font-weight: 600; white-space: nowrap;
  }
  /* ［できた］は緑の塗りつぶし（HP が回復する色）。文字は地の色で、明るい 5.02・暗い 9.48 */
  .hbtn.go { min-width: 72px; border-color: var(--hp-ok); background: var(--hp-ok); color: var(--card); font-weight: 700; }
  /* 新着が残っているときの上の1行（v1.45.1）。押すとホイミの画面に移る（v1.46.0）。
     v1.47.0 から HP のゲージとレベルを並べる。文字が大きいときは折り返す */
  .hoimi.hfold {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; width: 100%; min-height: 44px;
    background: transparent; text-align: left; font-family: inherit; cursor: pointer;
  }
  #toggle-hoimi, #toggle-hp, #toggle-hoimi-work { white-space: nowrap; }   /* 設定の［出す］が「出／す」と折れないように */
  /* HP のゲージ（v1.47.0）。色はドラゴンクエストのように、51以上＝緑・26〜50＝橙・25以下＝赤。
     文字も同じ色（地とのコントラスト比は上の変数の説明） */
  .hpg {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    color: var(--hpc); font-size: calc(12px * var(--fs)); font-weight: 700;
  }
  .hpg.ok { --hpc: var(--hp-ok); }
  .hpg.mid { --hpc: var(--hp-mid); }
  .hpg.low { --hpc: var(--hp-low); }
  .hpbar { width: 64px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .hpbar i { display: block; height: 100%; border-radius: 4px; background: var(--hpc); transition: width .4s; }
  .hplv { color: var(--ink); }
  .hpline { margin: 4px 0 2px; }
  /* レベルが上がったときだけ、ゲージを少し光らせる（2回点滅。音は出さない） */
  .hpg.lvup { animation: hpglow .6s ease-in-out 2; border-radius: 6px; }
  @keyframes hpglow { 50% { filter: brightness(1.4) drop-shadow(0 0 5px var(--hpc)); } }
  @media (prefers-reduced-motion: reduce) {
    .hpg.lvup { animation: none; }
    .hpbar i { transition: none; }
  }
  #hoimi-back { min-height: 44px; min-width: 44px; padding: 0 14px; }
  /* ホイミの画面（v1.46.0）。上＝今の3つ、中＝ふり返り、下＝一覧 */
  .hoimi.hview { margin-top: 12px; border-style: solid; background: var(--card); }
  .hsec { margin: 18px 0 8px; }
  .hsec h2 { font-size: calc(15px * var(--fs)); margin: 0 0 8px; }
  .hsec h3 { font-size: calc(12.5px * var(--fs)); color: var(--sub); margin: 16px 0 6px; }
  .hsec h3.work { color: var(--work-ink); }
  /* ふり返りの一番上：レベル・経験値・今月使った種類（v1.47.0） */
  .hsum { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .hlv { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; }
  .hlv b { color: var(--ink); font-size: calc(20px * var(--fs)); }
  .hlv span { color: var(--sub); font-size: calc(12.5px * var(--fs)); }
  .hxp { display: block; height: 6px; margin: 6px 0 8px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .hxp i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .hkinds { font-size: calc(12.5px * var(--fs)); }
  /* 縦の棒グラフ（直近7日・月ごと）。棒の上に回数、下の線が0の位置。今日・今月は文字を濃く */
  .hcols { display: flex; gap: 6px; padding: 0 2px; }
  .hcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .hcol .cb {
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    width: 100%; height: 92px; border-bottom: 1px solid var(--sub);
  }
  .hcol .cv { color: var(--sub); font-size: calc(11px * var(--fs)); line-height: 1.3; }
  .hcol .cb i { display: block; width: 60%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--accent); }
  .hcol .cl { margin-top: 3px; color: var(--sub); font-size: calc(10.5px * var(--fs)); white-space: nowrap; }
  .hcol.now .cv, .hcol.now .cl { color: var(--ink); font-weight: 700; }
  /* 今月の組ごと：1本の横棒を組の色で分ける（間は2pxあける）。下に色の見本と回数 */
  .hstack { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
  .hstack i { display: block; flex-basis: 0; min-width: 4px; }
  .k-body { background: var(--k-body); }
  .k-sense { background: var(--k-sense); }
  .k-mind { background: var(--k-mind); }
  .k-work { background: var(--k-work); }
  .hkeys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: calc(12px * var(--fs)); }
  .hkey { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .hkey .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .hkey small { color: var(--sub); }
  .htop { margin: 0; padding-left: 1.6em; font-size: calc(12.5px * var(--fs)); }
  .htop li { padding: 2px 0; }
  .htop li span { margin-right: 8px; }
  /* 一覧の1行。行を押すと、その行の中に［できた］が出る（v1.47.0。押しただけでは記録しない）。
     行の高さは44px以上。行と行はすき間をあけず線で区切る（すき間を足すと一覧が約660px長くなるため） */
  .hitem { border-bottom: 1px solid var(--line); background: var(--card); }
  .hitem .hhead {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 10px;
    border: 0; background: transparent; color: var(--ink);
    text-align: left; font-family: inherit; font-size: calc(13.5px * var(--fs)); cursor: pointer;
  }
  .hitem .hhead:active { background: var(--bg); }
  .hitem .hname { font-weight: 400; }
  .hitem.open { background: var(--pick-bg); }
  .hitem.open .hname { font-weight: 700; }
  .hitem .hact { display: flex; justify-content: flex-end; padding: 0 10px 8px; }
  .hitem.work .hhead { border-left: 4px solid var(--work-ink); }
  .hitem .hago { color: var(--sub); font-size: calc(12px * var(--fs)); white-space: nowrap; }
  .hitem .hago.today { color: var(--accent); font-weight: 700; }
  .hitem .hago.rare { color: var(--found-ink); font-weight: 700; }
  /* 同じ話題の記事（朝刊で1枚に畳んだ分） */
  .topic-more {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px;
    margin: -2px 0 8px; padding: 0 12px; border-radius: 8px; cursor: pointer; text-align: left;
    border: 1px dashed var(--line); background: transparent; color: var(--sub);
    font-size: calc(12px * var(--fs)); font-weight: 700;
  }
  .topic-more small { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 天気：短くまとめる */
  .weather.compact { padding: 6px 10px; }
  .weather.compact .wline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .weather.compact .wplace { margin: 0 4px 0 0; font-size: calc(11px * var(--fs)); }
  .weather.compact .wday { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .weather.compact .wday b { color: var(--sub); font-weight: 700; }
  .weather.compact .wsep { color: var(--line); }
  .weather.compact .wstocks { margin-top: 3px; padding-top: 3px; }
  /* 開いたテーマの一番下：読み終えたらここで片づけて次へ */
  .mseen {
    width: 100%; min-height: 46px; margin: 4px 0 6px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font-size: calc(13px * var(--fs)); font-weight: 700;
  }
  .mseen:active { background: var(--chip-bg); }
  /* 閉じたテーマの下の見出し（2本まで）。押すとテーマが開く。長い見出しは1行で「…」 */
  .mpeek {
    display: block; width: 100%; margin: -8px 0 0; padding: 0 0 8px calc(1em + 6px);
    border: 0; background: transparent; text-align: left; cursor: pointer;
  }
  .mpeek span {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: calc(12.5px * var(--fs)); line-height: 1.65; color: var(--sub);
  }
  /* まとめた行（動画・人物・作品）の見出しの前に添えるテーマ名 */
  .mpeek span b { font-weight: 700; color: var(--ink); margin-right: 6px; font-size: calc(11.5px * var(--fs)); }
  /* 件数の多いテーマの「残り◯件を見る」 */
  .mmore {
    width: 100%; min-height: 44px; margin: 2px 0 4px; border-radius: 10px; cursor: pointer;
    border: 1px dashed var(--accent); background: transparent; color: var(--accent);
    font-size: calc(13px * var(--fs)); font-weight: 700;
  }
  /* 朝刊の中の小分類の見出し */
  .msec {
    display: flex; align-items: center; gap: 6px; margin: 8px 2px 4px;
    font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--sub);
  }
  .msec i { font-style: normal; font-weight: 400; }

  /* ---- 書庫の見出し ---- */
  .shelf-head { margin: 18px 2px 6px; }
  .shelf-head h2 { margin: 0; font-size: calc(17px * var(--fs)); }
  .shelf-head p { margin: 2px 0 0; color: var(--sub); font-size: calc(11.5px * var(--fs)); }
  /* 書庫は毎回1行に畳んで始める（CODE_TASK_08 ①）。行全体が押せるボタン */
  .shelf-head h2 .scaret { margin-left: 6px; color: var(--sub); font-size: calc(14px * var(--fs)); }
  .shelf-fold {
    display: block; width: calc(100% - 4px); min-height: 52px; padding: 8px 12px; cursor: pointer; text-align: left;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  }
  .shelf-fold:active { border-color: var(--accent); }
  .shelf-new { display: flex; gap: 6px; margin-top: 2px; color: var(--sub); font-size: calc(12px * var(--fs)); }
  .shelf-new .sn-names { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf-new .sn-rest { flex: none; white-space: nowrap; font-weight: 700; }
  .shelf-toggle {
    padding: 0; border: 0; background: transparent; color: var(--ink); cursor: pointer;
    font: inherit; font-weight: 700; min-height: 40px;
  }

  /* 朝刊を読み切ったとき */
  .done-today { font-weight: 700; line-height: 1.8; }
  .tidy-all { margin-left: auto; }

  /* 前回見てから届いた記事（NEWより控えめ） */
  .since {
    color: var(--accent); font-weight: 700;
    font-size: calc(11px * var(--fs)); white-space: nowrap;
  }
  .since.dot { font-size: calc(12px * var(--fs)); }

  .found {
    background: var(--found-bg); color: var(--found-ink);
    border-radius: 4px; padding: 1px 5px; font-weight: 700;
    font-size: calc(11px * var(--fs)); letter-spacing: .02em;
  }
  .found-btn { border-color: var(--found-ink); color: var(--found-ink); }
  /* ほかの分野から：どの分野の人気記事か（v1.42.0）。色は変数で決める（「自動」でも明るい画面は明るい色に） */
  .field {
    background: var(--field-bg); color: var(--field-ink);
    border-radius: 4px; padding: 1px 5px; font-weight: 700;
    font-size: calc(11px * var(--fs)); white-space: nowrap;
  }
  .note {
    margin: 8px 12px 0; padding: 8px 10px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--sub); font-size: calc(11.5px * var(--fs));
  }

  .new {
    font-size: calc(11px * var(--fs)); font-weight: 800; color: #111827; background: #f59e0b;
    border-radius: 4px; padding: 1px 5px; letter-spacing: .04em;
  }
  .views { font-size: calc(11px * var(--fs)); color: var(--sub); white-space: nowrap; }
  /* はてなブックマーク数。直リンクの記事にだけ付く */
  .hb {
    font-size: calc(11px * var(--fs)); color: #0f766e; background: #ccfbf1;
    border-radius: 5px; padding: 1px 5px; font-weight: 700; white-space: nowrap;
  }
  :root[data-theme="dark"] .hb, :root[data-theme="auto"] .hb {
    color: #5eead4; background: #10302e;
  }
  /* 👎 つまらない。押しやすく、かつ目立ちすぎない位置に */
  .votes { margin-left: auto; display: inline-flex; gap: 2px; flex-shrink: 0; }
  .boring {
    min-width: 36px; min-height: 32px; padding: 0 6px; border-radius: 8px; cursor: pointer;
    border: 0; background: transparent;
    font-size: calc(13px * var(--fs)); line-height: 1; opacity: .4;
  }
  .boring:active { opacity: 1; border-color: var(--accent); }
  /* 👍 良かった。👎と同じ形にそろえ、右端に2つ並べる */
  .good {
    min-width: 36px; min-height: 32px; padding: 0 6px; border-radius: 8px; cursor: pointer;
    border: 0; background: transparent;
    font-size: calc(13px * var(--fs)); line-height: 1; opacity: .4;
  }
  .good:active { opacity: 1; border-color: var(--accent); }
  .good.on { opacity: 1; background: var(--chip-bg); }
  .good + .boring { margin-left: 4px; }

  /* 探す窓 */
  .searchbox { margin: 8px 0 2px; }
  .searchbox input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: calc(13px * var(--fs)); font-family: inherit;
  }
  /* 個人ブログ・note等（報道と区別するための印） */
  .blog {
    font-size: calc(11px * var(--fs)); color: #7c3aed; background: #f3e8ff;
    border: 1px solid #e9d5ff; border-radius: 5px; padding: 1px 6px;
    font-weight: 600; white-space: nowrap;
  }
  :root[data-theme="dark"] .blog, :root[data-theme="auto"] .blog {
    color: #c4b5fd; background: #2a2440; border-color: #3f3663;
  }
  /* 会社が運営するブログ（個人の書き物と読み方が違う） */
  .blog.corp { color: #0f766e; background: #ccfbf1; border-color: #99f6e4; }
  :root[data-theme="dark"] .blog.corp, :root[data-theme="auto"] .blog.corp {
    color: #5eead4; background: #10302e; border-color: #1f4d49;
  }
  /* 見出しにテーマ名が無い＝本文で触れているだけの記事 */
  .rel {
    font-size: calc(11px * var(--fs)); color: var(--sub); background: var(--chip-bg);
    border: 1px dashed var(--line); border-radius: 5px; padding: 1px 6px;
    font-weight: 600; white-space: nowrap;
  }
  .pw { font-size: calc(11px * var(--fs)); border-radius: 5px; padding: 1px 6px; font-weight: 700; white-space: nowrap; }
  .pw.paid { color: #9a3412; background: #ffedd5; border: 1px solid #fed7aa; }
  .pw.partial { color: var(--sub); background: var(--chip-bg); border: 1px solid var(--line); font-weight: 600; }
  /* 会員限定：お金は要らないが、登録しないと本文が読めないもの */
  .pw.member { color: #1d4ed8; background: #dbeafe; border: 1px solid #bfdbfe; }
  :root[data-theme="dark"] .pw.member, :root[data-theme="auto"] .pw.member {
    color: #93c5fd; background: #1e2a44; border-color: #2f3f66;
  }
  .card .time { font-size: calc(11px * var(--fs)); color: var(--sub); }
  .card:has(.pw.paid) a.title { color: var(--sub); }

  /* 既読（「既読も表示」時のみ現れる） */
  .card.read { opacity: var(--read-opacity); }
  .card.read a.title { color: var(--sub); font-weight: 500; }

  .empty { color: var(--sub); font-size: calc(12.5px * var(--fs)); padding: 6px 2px; }

  /* 動画カード：左サムネ・右タイトルの横並び */
  .card.video { padding: 0; overflow: hidden; }
  .card.video a.vlink {
    display: flex; gap: 10px; align-items: flex-start;
    text-decoration: none; color: var(--ink); padding: 8px 10px;
  }
  .card.video a.vlink:active .title { color: var(--accent); }
  .card.video .thumb { position: relative; flex: 0 0 108px; display: block; }
  .card.video .thumb img { width: 108px; height: 61px; display: block; object-fit: cover; border-radius: 6px; }
  .card.video .thumb .play {
    position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); color:#fff; font-size: 9px; border-radius: 999px;
  }
  .card.video .vtext { min-width: 0; }
  .card.video .title { display: block; font-size: calc(12.5px * var(--fs)); font-weight: 600; line-height: 1.38; }
  .card.video .meta { margin-top: 4px; }

  /* skim：初期は隠しておく余剰カード */
  .gitems:not(.expanded) > .card.extra { display: none; }
  .more-btn, .older-btn {
    display: block; width: 100%; margin: 2px 0 4px; padding: 6px;
    background: transparent; border: 1px dashed var(--line); border-radius: 9px;
    color: var(--cat); font-size: calc(12px * var(--fs)); font-weight: 700; cursor: pointer;
  }
  /* 「さらに古い記事」は、貯めてある記事へ降りていくボタン。控えめに */
  .older-btn { border-style: solid; color: var(--sub); font-weight: 600; }

  /* 動画ブロック（記事と分けて最下部に置く）
     記事の一覧と地続きに見えないよう、枠で囲んだ別ブロックとして扱う */
  details.cat.videos {
    margin-top: 32px; padding: 4px 12px 10px;
    border: 2px solid var(--cat); border-radius: 14px;
    background: var(--videos-bg);
  }
  /* 枠の上辺に重ねるラベル。記事の続きではないことを一目で分かるようにする */
  details.cat.videos::before {
    content: "ここから下は動画です";
    display: block; width: fit-content; margin: -16px auto 6px;
    font-size: calc(10.5px * var(--fs)); font-weight: 700; letter-spacing: .06em;
    color: var(--cat); background: var(--bg); padding: 0 10px;
  }
  details.cat.videos > summary { border-bottom-width: 1px; }
  details.cat.videos .card { background: var(--card); }

  /* 広い画面では2列にする。
     1440pxで中身720px・左右360pxずつ空いており、縦が7画面分あった。
     スマホは1列のまま（横に並べると1件あたりが窮屈になるため）。 */
  @media (min-width: 1000px) {
    .wrap { max-width: 1120px; }
    .gitems {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 10px; align-items: start;
    }
    /* 各テーマの先頭記事と、時代の区切りは横いっぱいに置く */
    .gitems > .card.lead, .gitems > .agesep { grid-column: 1 / -1; }
  }

  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  footer details.diag > summary { cursor: pointer; font-size: 12px; color: var(--sub); }
  footer table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  footer td { padding: 4px 6px; border-bottom: 1px dashed var(--line); color: var(--sub); }
  footer td.st-ok { color:#15803d; }
  footer td.st-ng { color:#b45309; }
  .loaderr { padding: 24px 14px; color:#b91c1c; font-size: 14px; }
</style>
</head>
