<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>マイニュース</title>
<style>
  /* 明るい配色（既定） */
  :root {
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --cat:#2563eb;
    --chip-bg:#eef0f3; --chip-ink:#374151; --btn-bg:#fff;
    --read-opacity:.5;
    --videos-bg:#fdf2f2;   /* 動画ブロックの下地（記事と見分けるため） */
    --pick-bg:#eff6ff;     /* 選択中のカード */
    --fs:1;           /* 文字サイズの倍率 */
  }
  /* 端末が暗い設定のとき（手動指定が無い＝自動のとき）だけ暗くする */
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg:#111318; --card:#1b1f27; --ink:#e8eaed; --sub:#9aa3af;
      --line:#2b313c; --accent:#7aa7ff; --chip-bg:#262c37; --chip-ink:#c3cad6;
      --btn-bg:#1b1f27;
      --read-opacity:.8;
      --videos-bg:#1a1416;
      --pick-bg:#16233a;
    }
  }
  /* 手動で「暗い」を選んだとき */
  :root[data-theme="dark"] {
    --bg:#111318; --card:#1b1f27; --ink:#e8eaed; --sub:#9aa3af;
    --line:#2b313c; --accent:#7aa7ff; --chip-bg:#262c37; --chip-ink:#c3cad6;
    --btn-bg:#1b1f27;
    --read-opacity:.8;
    --videos-bg:#1a1416;
    --pick-bg:#16233a;
  }
  /* 文字サイズ */
  :root[data-font="s"] { --fs:.92; }
  :root[data-font="l"] { --fs:1.12; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px 40px; }

  header { padding: 16px 4px 4px; }
  header h1 { font-size: calc(20px * var(--fs)); margin: 0; letter-spacing: .02em; }
  header .meta-head {
    color: var(--sub); font-size: calc(12px * var(--fs)); margin-top: 3px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  header .age.stale { color: #d08700; font-weight: 600; }
  /* 今日読むべき「新着」を主役に。貯まっている「未読」は控えめに添える。 */
  header .newcount {
    font-weight: 800; color: #111827; background: #f59e0b;
    border-radius: 999px; padding: 1px 9px; font-size: calc(12.5px * var(--fs));
  }
  header button.newcount { border: 0; cursor: pointer; }
  header button.newcount.on {
    background: var(--btn-bg); color: var(--accent);
    border: 1px solid var(--accent); font-weight: 700;
  }
  header .nonew { font-weight: 700; color: var(--sub); font-size: calc(12px * var(--fs)); }
  /* 新着画面で、そのテーマがどのカテゴリのものか分かるように */
  .ghead .gcat {
    margin-left: auto; font-size: calc(10px * var(--fs)); font-weight: 600;
    color: var(--sub); background: var(--chip-bg); border-radius: 999px; padding: 1px 8px;
  }
  header .unread { font-weight: 500; color: var(--sub); font-size: calc(11px * var(--fs)); }
  /* 取れなかったフィードの知らせ。目立つが邪魔にならない大きさに留める */
  .trouble {
    font-size: calc(10.5px * var(--fs)); font-weight: 700; cursor: pointer;
    color: #92400e; background: #fef3c7; border: 1px solid #fde68a;
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  :root[data-theme="dark"] .trouble, :root[data-theme="auto"] .trouble {
    color: #fcd34d; background: #3a2d10; border-color: #5b4818;
  }
  .trouble-list {
    flex-basis: 100%; margin-top: 6px; padding: 8px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    font-size: calc(11.5px * var(--fs)); color: var(--sub);
  }
  .trouble-list p { margin: 0 0 6px; }
  .trouble-list table { width: 100%; border-collapse: collapse; }
  .trouble-list td {
    padding: 3px 4px; border-bottom: 1px dashed var(--line);
    font-size: calc(11px * var(--fs)); vertical-align: top;
  }

  .tools { margin: 8px 0 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tool-btn {
    font-size: calc(11.5px * var(--fs)); padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub); font-weight: 600;
  }
  .tool-btn.on { border-color: var(--accent); color: var(--accent); }
  .tool-btn.danger { color: #b91c1c; border-color: #fecaca; }
  :root[data-theme="dark"] .tool-btn.danger,
  :root[data-theme="auto"] .tool-btn.danger { color: #f87171; border-color: #4b2020; }

  /* 設定（毎日は使わないものを畳む） */
  .settings {
    margin: 6px 0 2px; padding: 6px 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line);
  }
  .settings .srow {
    display: flex; align-items: center; gap: 10px; padding: 5px 0;
    font-size: calc(12px * var(--fs)); color: var(--sub);
  }
  .settings .srow span { flex: 1 1 auto; }

  /* テーマごとの「読めない記事を既読に」 */
  .ghead .lock-btn {
    margin-left: auto; font-size: calc(10.5px * var(--fs)); padding: 3px 8px;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .ghead .lock-btn + .read-all { margin-left: 0; }

  /* 上部のカテゴリジャンプ */
  .catnav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .catnav .nav-chip {
    flex: 0 0 auto; font-size: calc(11.5px * var(--fs)); font-weight: 700; text-decoration: none;
    color: var(--cat); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .catnav .nav-chip span { margin-left: 5px; color: var(--sub); font-weight: 500; font-size: calc(10.5px * var(--fs)); }
  .catnav .nav-chip .navnew {
    margin-left: 5px; padding: 0 6px; border-radius: 999px;
    background: #f59e0b; color: #111827; font-weight: 800;
  }

  /* カテゴリ（大見出し・折りたたみ） */
  details.cat { margin: 16px 0 4px; scroll-margin-top: 8px; }
  details.cat > summary {
    cursor: pointer; list-style: none; padding: 4px 2px 6px;
    border-bottom: 2px solid var(--cat);
  }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary h2 {
    margin: 0; font-size: calc(12px * var(--fs)); font-weight: 800; letter-spacing: .08em;
    color: var(--cat); display: flex; align-items: center; gap: 6px;
  }
  details.cat > summary h2::before { content: "▾"; font-size: 11px; }
  details.cat:not([open]) > summary h2::before { content: "▸"; }
  details.cat > summary .catcount {
    margin-left: auto; font-weight: 500; color: var(--sub);
    font-size: calc(10.5px * var(--fs)); letter-spacing: 0;
    display: flex; align-items: center; gap: 6px;
  }
  details.cat > summary .catnew {
    padding: 0 7px; border-radius: 999px;
    background: #f59e0b; color: #111827; font-weight: 800;
    font-size: calc(10.5px * var(--fs));
  }
  details.cat > .body { padding-top: 4px; }

  /* テーマ（中見出し） */
  .group { margin: 12px 0 8px; }
  h3.ghead {
    display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
    font-size: calc(15px * var(--fs)); font-weight: 700;
  }
  .ghead .gname { border-left: 3px solid var(--cat); padding-left: 8px; }
  .ghead .gcount { font-size: calc(11px * var(--fs)); color: var(--sub); font-weight: 400; }
  .ghead .gnew {
    font-size: calc(10px * var(--fs)); font-weight: 800; color: #111827; background: #f59e0b;
    border-radius: 999px; padding: 0 6px;
  }
  .ghead .read-all {
    margin-left: auto; font-size: calc(10.5px * var(--fs)); padding: 3px 8px;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .ghead .read-all:active { color: var(--accent); border-color: var(--accent); }

  .tool-btn.star.on { border-color: #f59e0b; color: #b45309; }
  :root[data-theme="dark"] .tool-btn.star.on,
  :root[data-theme="auto"] .tool-btn.star.on { color: #fbbf24; }

  /* 天気（見出しの下） */
  .weather {
    margin-top: 8px; padding: 7px 10px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line);
    font-size: calc(12.5px * var(--fs)); color: var(--ink);
  }
  .weather .wplace {
    font-size: calc(10.5px * var(--fs)); font-weight: 800;
    letter-spacing: .08em; color: var(--sub); margin-bottom: 2px;
  }
  .weather .wrow { display: flex; align-items: center; gap: 7px; padding: 2px 0; flex-wrap: wrap; }
  .weather .wrow b { font-weight: 700; color: var(--sub); min-width: 2.4em; }
  .weather .wicon { font-size: calc(15px * var(--fs)); line-height: 1; }
  .weather .wtext { flex: 1 1 auto; min-width: 6em; }
  .weather .wtemp { font-weight: 700; font-variant-numeric: tabular-nums; }
  .weather .wpop {
    font-size: calc(11px * var(--fs)); color: var(--sub); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .weather .wpop.strong { color: #1d4ed8; font-weight: 700; }
  :root[data-theme="dark"] .weather .wpop.strong,
  :root[data-theme="auto"] .weather .wpop.strong { color: #93c5fd; }

  /* 記事の古さの区切り（NEWバッジとは役割が違う） */
  .agesep {
    display: flex; align-items: center; gap: 8px;
    margin: 10px 2px 8px; color: var(--sub); font-size: calc(10.5px * var(--fs));
  }
  .agesep::before, .agesep::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .agesep span { white-space: nowrap; letter-spacing: .04em; }

  /* 読み終えたテーマ（消さずに戻り道を残す） */
  .group.done .empty { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .reread-btn {
    padding: 4px 10px; border-radius: 999px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--cat);
    font-size: calc(11.5px * var(--fs));
  }

  /* 版と更新履歴 */
  footer.ver { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 10px; }
  footer.ver summary {
    cursor: pointer; font-size: calc(11.5px * var(--fs)); color: var(--sub);
  }
  footer.ver table.vlog { width: 100%; border-collapse: collapse; margin-top: 8px; }
  footer.ver table.vlog td {
    padding: 4px 6px; border-bottom: 1px dashed var(--line);
    color: var(--sub); font-size: calc(11px * var(--fs)); vertical-align: top;
  }
  footer.ver table.vlog td:first-child { font-weight: 700; white-space: nowrap; }
  footer.ver table.vlog td:nth-child(2) { white-space: nowrap; }

  /* 株価（記事とは別のブロック） */
  .stocks {
    margin: 10px 0 4px; padding: 8px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  .stocks h2 {
    margin: 0 0 4px; font-size: calc(11px * var(--fs)); font-weight: 800;
    letter-spacing: .08em; color: var(--sub);
  }
  .stocks .srow {
    display: flex; align-items: baseline; gap: 8px;
    font-size: calc(13px * var(--fs)); padding: 2px 0;
  }
  .stocks .sname { font-weight: 600; }
  .stocks .sprice { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stocks .sdiff {
    font-size: calc(11.5px * var(--fs)); font-weight: 700; color: var(--sub);
    min-width: 8.5em; text-align: right; font-variant-numeric: tabular-nums;
  }
  .stocks .sdiff.up { color: #b91c1c; }     /* 日本の慣習に合わせ、上げは赤 */
  .stocks .sdiff.down { color: #1d4ed8; }
  :root[data-theme="dark"] .stocks .sdiff.up,
  :root[data-theme="auto"] .stocks .sdiff.up { color: #f87171; }
  :root[data-theme="dark"] .stocks .sdiff.down,
  :root[data-theme="auto"] .stocks .sdiff.down { color: #93c5fd; }

  /* 選んでまとめて既読にする */
  .card.picking { cursor: pointer; }
  .pick {
    position: absolute; top: 4px; right: 6px;
    font-size: calc(17px * var(--fs)); color: var(--sub); line-height: 1;
  }
  .pick.on { color: var(--accent); }
  .pickspacer { height: 56px; }
  .pickbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--card);
    border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(0,0,0,.14);
    font-size: calc(12.5px * var(--fs)); font-weight: 700;
  }
  .pickbar #pick-count { flex: 1 1 auto; color: var(--sub); }
  .pick-btn {
    padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 700;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--sub);
    font-size: calc(12.5px * var(--fs)); white-space: nowrap;
  }
  .pick-btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 選択中であることが一目で分かるように、カード全体に色を敷く */
  .card.picked { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--pick-bg); }

  /* 記事カード */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px;
    position: relative;   /* ★ボタンを右上に置くため */
  }

  /* 指で払って仕分ける。
     touch-action: pan-y は「縦の送りはブラウザに任せ、横はこちらで扱う」の意味。
     これを書かないと、横に払っても画面が一緒に動いてしまう。 */
  .card { touch-action: pan-y; }
  .card.swiping { transition: none; will-change: transform; }
  .card.sw-out { transition: transform .18s ease, opacity .18s ease; }

  /* いま何が起きるかを画面上部に出す（払っている最中だけ） */
  #swipe-hint {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
    padding: 7px 14px; border-radius: 999px; pointer-events: none;
    font-size: 12.5px; font-weight: 700;
    background: var(--card); color: var(--sub); border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  #swipe-hint.read.ready { background: #15803d; color: #fff; border-color: #15803d; }
  #swipe-hint.fav.ready { background: #b45309; color: #fff; border-color: #b45309; }

  /* 取り消しの案内。指1本で消せてしまうので、必ず戻り道を出す */
  #toast {
    position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 12px;
    background: var(--ink); color: var(--bg);
    font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,0,0,.28);
  }
  #toast span { flex: 1 1 auto; }
  #toast button {
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid currentColor; background: transparent; color: inherit;
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }

  /* ★お気に入り。リンクの外側に置くので、押しても記事は開かない */
  .fav {
    position: absolute; top: 4px; right: 4px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border: 0; background: transparent; cursor: pointer;
    color: var(--sub); font-size: calc(15px * var(--fs)); line-height: 1;
  }
  .fav.on { color: #f59e0b; }
  .card a.title, .card.video .vtext .title { padding-right: 26px; }
  .card a.title {
    color: var(--ink); text-decoration: none; font-size: calc(13.5px * var(--fs));
    font-weight: 600; display: block; letter-spacing: .01em; line-height: 1.4;
  }
  .card a.title:active { color: var(--accent); }
  .card .summary { color: var(--sub); font-size: calc(12px * var(--fs)); margin-top: 5px; line-height: 1.5; }

  .card.lead { border-left: 3px solid var(--cat); padding: 11px 13px; }
  .card.lead a.title { font-size: calc(15.5px * var(--fs)); line-height: 1.42; }

  /* メタ行 */
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .chip {
    font-size: calc(10px * var(--fs)); color: var(--chip-ink); background: var(--chip-bg);
    border-radius: 5px; padding: 1px 6px; font-weight: 600; white-space: nowrap;
  }
  .new {
    font-size: calc(9.5px * var(--fs)); font-weight: 800; color: #111827; background: #f59e0b;
    border-radius: 4px; padding: 1px 5px; letter-spacing: .04em;
  }
  .views { font-size: calc(10px * var(--fs)); color: var(--sub); white-space: nowrap; }
  /* 個人ブログ・note等（報道と区別するための印） */
  .blog {
    font-size: calc(10px * var(--fs)); color: #7c3aed; background: #f3e8ff;
    border: 1px solid #e9d5ff; border-radius: 5px; padding: 1px 6px;
    font-weight: 600; white-space: nowrap;
  }
  :root[data-theme="dark"] .blog, :root[data-theme="auto"] .blog {
    color: #c4b5fd; background: #2a2440; border-color: #3f3663;
  }
  /* 会社が運営するブログ（個人の書き物と読み方が違う） */
  .blog.corp { color: #0f766e; background: #ccfbf1; border-color: #99f6e4; }
  :root[data-theme="dark"] .blog.corp, :root[data-theme="auto"] .blog.corp {
    color: #5eead4; background: #10302e; border-color: #1f4d49;
  }
  /* 見出しにテーマ名が無い＝本文で触れているだけの記事 */
  .rel {
    font-size: calc(10px * var(--fs)); color: var(--sub); background: var(--chip-bg);
    border: 1px dashed var(--line); border-radius: 5px; padding: 1px 6px;
    font-weight: 600; white-space: nowrap;
  }
  .pw { font-size: calc(10px * var(--fs)); border-radius: 5px; padding: 1px 6px; font-weight: 700; white-space: nowrap; }
  .pw.paid { color: #9a3412; background: #ffedd5; border: 1px solid #fed7aa; }
  .pw.partial { color: var(--sub); background: var(--chip-bg); border: 1px solid var(--line); font-weight: 600; }
  /* 会員限定：お金は要らないが、登録しないと本文が読めないもの */
  .pw.member { color: #1d4ed8; background: #dbeafe; border: 1px solid #bfdbfe; }
  :root[data-theme="dark"] .pw.member, :root[data-theme="auto"] .pw.member {
    color: #93c5fd; background: #1e2a44; border-color: #2f3f66;
  }
  .card .time { font-size: calc(10.5px * var(--fs)); color: var(--sub); }
  .card:has(.pw.paid) a.title { color: var(--sub); }

  /* 既読（「既読も表示」時のみ現れる） */
  .card.read { opacity: var(--read-opacity); }
  .card.read a.title { color: var(--sub); font-weight: 500; }

  .empty { color: var(--sub); font-size: calc(12.5px * var(--fs)); padding: 6px 2px; }

  /* 動画カード：左サムネ・右タイトルの横並び */
  .card.video { padding: 0; overflow: hidden; }
  .card.video a.vlink {
    display: flex; gap: 10px; align-items: flex-start;
    text-decoration: none; color: var(--ink); padding: 8px 10px;
  }
  .card.video a.vlink:active .title { color: var(--accent); }
  .card.video .thumb { position: relative; flex: 0 0 108px; display: block; }
  .card.video .thumb img { width: 108px; height: 61px; display: block; object-fit: cover; border-radius: 6px; }
  .card.video .thumb .play {
    position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); color:#fff; font-size: 9px; border-radius: 999px;
  }
  .card.video .vtext { min-width: 0; }
  .card.video .title { display: block; font-size: calc(12.5px * var(--fs)); font-weight: 600; line-height: 1.38; }
  .card.video .meta { margin-top: 4px; }

  /* skim：初期は隠しておく余剰カード */
  .gitems:not(.expanded) > .card.extra { display: none; }
  .more-btn, .older-btn {
    display: block; width: 100%; margin: 2px 0 4px; padding: 6px;
    background: transparent; border: 1px dashed var(--line); border-radius: 9px;
    color: var(--cat); font-size: calc(12px * var(--fs)); font-weight: 700; cursor: pointer;
  }
  /* 「さらに古い記事」は、貯めてある記事へ降りていくボタン。控えめに */
  .older-btn { border-style: solid; color: var(--sub); font-weight: 600; }

  /* 動画ブロック（記事と分けて最下部に置く）
     記事の一覧と地続きに見えないよう、枠で囲んだ別ブロックとして扱う */
  details.cat.videos {
    margin-top: 32px; padding: 4px 12px 10px;
    border: 2px solid var(--cat); border-radius: 14px;
    background: var(--videos-bg);
  }
  /* 枠の上辺に重ねるラベル。記事の続きではないことを一目で分かるようにする */
  details.cat.videos::before {
    content: "ここから下は動画です";
    display: block; width: fit-content; margin: -16px auto 6px;
    font-size: calc(10.5px * var(--fs)); font-weight: 700; letter-spacing: .06em;
    color: var(--cat); background: var(--bg); padding: 0 10px;
  }
  details.cat.videos > summary { border-bottom-width: 1px; }
  details.cat.videos .card { background: var(--card); }

  /* 広い画面では2列にする。
     1440pxで中身720px・左右360pxずつ空いており、縦が7画面分あった。
     スマホは1列のまま（横に並べると1件あたりが窮屈になるため）。 */
  @media (min-width: 1000px) {
    .wrap { max-width: 1120px; }
    .gitems {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 10px; align-items: start;
    }
    /* 各テーマの先頭記事と、時代の区切りは横いっぱいに置く */
    .gitems > .card.lead, .gitems > .agesep { grid-column: 1 / -1; }
  }

  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  footer details.diag > summary { cursor: pointer; font-size: 12px; color: var(--sub); }
  footer table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  footer td { padding: 4px 6px; border-bottom: 1px dashed var(--line); color: var(--sub); }
  footer td.st-ok { color:#15803d; }
  footer td.st-ng { color:#b45309; }
  .loaderr { padding: 24px 14px; color:#b91c1c; font-size: 14px; }
</style>
</head>

</div>

<script src="app.js"></script>
</body>
